[project]
name = "agent-lifecycle-workshop"
version = "0.1.0"
description = "Weather agent lifecycle workshop: evals, mutation testing, tracing and feedback"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.70,<4",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
]

[project.optional-dependencies]
eval = [
    "deepeval>=3,<4",
]
mlx = ["mlx-lm==0.31.3"]

# Install workshop_support (the shared tool and tracing code), so every exercise can import it.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workshop_support"]

[tool.pytest.ini_options]
# DeepEval's pytest plugin imports deepeval before test_golden.py can switch off its telemetry.
# assert_test works without the plugin.
addopts = "-p no:deepeval"
filterwarnings = ["ignore::DeprecationWarning"]  # from inside deepeval
